<!doctype html>
<html lang="zh-CN" style="display: none">
  <head>
    <script src="theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>银狐木马检测</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header id="header" class="header-safe">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <path d="m8.5 12 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div>
            <div class="brand-name">银狐木马检测</div>
            <div class="header-subtitle">Virus Detector</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="github-btn" title="查看 GitHub 项目" aria-label="查看 GitHub 项目">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.68c-2.78.6-3.37-1.18-3.37-1.18-.45-1.15-1.11-1.45-1.11-1.45-.91-.62.07-.61.07-.61 1 .07 1.54 1.04 1.54 1.04.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.53 9.53 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.9.68 1.82v2.7c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" /></svg>
          </button>
          <button class="icon-button" id="settings-btn" title="打开设置" aria-label="打开设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.04.04-2.66 2.66-.04-.04A1.7 1.7 0 0 0 15.2 19a1.7 1.7 0 0 0-1.2 1.55V21h-4v-.45A1.7 1.7 0 0 0 8.8 19a1.7 1.7 0 0 0-1.88.34l-.04.04-2.66-2.66.04-.04A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1.2H3v-3.6h.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.04-.04 2.66-2.66.04.04A1.7 1.7 0 0 0 8.8 4a1.7 1.7 0 0 0 1.2-1.55V2h4v.45A1.7 1.7 0 0 0 15.2 4a1.7 1.7 0 0 0 1.88-.34l.04-.04 2.66 2.66-.04.04A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1.2H21v3.6h-.05A1.7 1.7 0 0 0 19.4 15Z" /></svg>
          </button>
        </div>
        <span id="bg-container" class="update-target" aria-hidden="true"></span>
        <span id="github-tooltip" class="visually-hidden">了解更多</span>
      </header>

      <main id="main-content">
        <section id="loading" class="loading-state" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <p>正在分析当前网站</p>
        </section>

        <section id="safe-panel" style="display: none">
          <div class="risk-card safe">
            <div class="risk-card-top">
              <div class="score-icon" id="safe-score-icon" aria-hidden="true"></div>
              <div class="score-copy">
                <span class="eyebrow">当前网站</span>
                <strong id="current-domain">-</strong>
              </div>
              <div class="score-number"><span id="score-value" class="score-value safe-color">0</span><small>分</small></div>
            </div>
            <div class="score-gauge" aria-label="风险评分刻度">
              <div class="gauge-bar"><span class="gauge-segment gauge-green"></span><span class="gauge-segment gauge-yellow"></span><span class="gauge-segment gauge-red"></span></div>
              <div class="gauge-indicator" id="safe-gauge-indicator"><span class="gauge-arrow arrow-green"></span></div>
            </div>
          </div>
          <div class="status-badge safe" id="status-text">未发现高风险信号</div>
        </section>

        <section id="warning-panel" style="display: none">
          <div class="risk-card danger">
            <div class="risk-card-top">
              <div class="score-icon" id="warning-score-icon" aria-hidden="true"></div>
              <div class="score-copy"><span class="eyebrow">当前网站</span><strong>检测到高风险信号</strong></div>
              <div class="score-number"><span id="warning-score-value" class="score-value danger-color">0</span><small>分</small></div>
            </div>
            <div class="score-gauge" aria-label="风险评分刻度">
              <div class="gauge-bar"><span class="gauge-segment gauge-green"></span><span class="gauge-segment gauge-yellow"></span><span class="gauge-segment gauge-red"></span></div>
              <div class="gauge-indicator" id="warning-gauge-indicator"><span class="gauge-arrow arrow-red"></span></div>
            </div>
          </div>
          <div class="status-badge danger" id="warning-status-text">危险警告</div>
          <div class="alert-box"><strong>请勿输入信息或下载文件</strong><span>建议关闭当前网页，并通过官方渠道访问服务。</span></div>
          <div id="official-link-section" style="display: none"><a id="official-link-btn" class="official-link-btn" href="#" target="_blank" rel="noopener noreferrer">前往官方网站 <span id="official-link-text"></span></a></div>
        </section>

        <section id="whitelist-panel" style="display: none" class="whitelist-state">
          <div class="whitelist-symbol" aria-hidden="true">✓</div>
          <strong>此网站已被信任</strong>
          <p>已跳过所有检测规则。</p>
        </section>

        <section id="details-section" class="collapsible-section">
          <button id="details-toggle" class="details-title" type="button">
            <span>检测明细</span>
            <span class="details-hint">展开查看</span>
            <svg class="collapse-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <div class="collapsible-content"><div class="collapsible-inner"><div class="detail-items">
            <div class="detail-item" id="detail-rule1"><span class="detail-icon"></span><span class="detail-text">域名仿冒检测: 待检测</span></div>
            <div class="detail-item" id="detail-rule2"><span class="detail-icon"></span><span class="detail-text">下载检测: 待检测</span></div>
            <div class="detail-item" id="detail-rule3"><span class="detail-icon"></span><span class="detail-text">ICP备案: 待检测</span></div>
            <div class="detail-item" id="detail-rule4"><span class="detail-icon"></span><span class="detail-text">链接分析: 待检测</span></div>
            <div class="detail-item" id="detail-rule5"><span class="detail-icon"></span><span class="detail-text">代码工程化: 待检测</span></div>
            <div class="detail-item" id="detail-domainAge"><span class="detail-icon"></span><span class="detail-text">域名年龄: 待检测</span></div>
            <div class="detail-item" id="detail-ageBonus"><span class="detail-icon"></span><span class="detail-text">域名减分: 待检测</span></div>
          </div></div></div>
        </section>

        <section id="safety-tips" style="display: none">
          <strong>安全建议</strong>
          <ul><li>不要输入个人信息</li><li>不要下载或运行网站文件</li><li>通过官方渠道获取软件</li></ul>
        </section>
      </main>

      <footer id="footer">
        <button id="whitelist-btn" class="footer-btn whitelist-btn" title="信任或移出白名单"><span class="footer-icon">☆</span><span class="btn-label">加入白名单</span></button>
        <button id="refresh-btn" class="footer-btn refresh-btn" title="重新检测"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0 2 5.3" /><path d="M20 4v7h-7" /></svg><span class="btn-label">重新检测</span></button>
        <div class="footer-secondary">
          <button id="report-false-btn" class="text-button" title="报告此网站为误报"><span class="btn-label">此报告有误</span></button>
          <button id="report-phish-btn" class="text-button danger-button" title="确认此网站为钓鱼网站"><span class="btn-label">鉴定为钓鱼</span></button>
          <span class="footer-version"></span>
        </div>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
